<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - Profit & Loss Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3 mb-3 p-3 shadow-sm">
        <i class="fa-solid fa-lock-open fa-2x"></i>
      </div>
      <h3 class="fw-bold text-dark">Set New Password</h3>
      <p class="text-muted small">Account verified for: <strong>{{ target_user.full_name|default:target_user.user_id }}</strong></p>
    </div>

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show small py-2" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'accounts:reset_password' %}">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label small fw-semibold text-muted">New Password (min 6 characters)</label>
        <input type="password" name="new_password" class="form-control" placeholder="••••••••••••" required>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold text-muted">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="••••••••••••" required>
      </div>

      <button type="submit" class="btn btn-emerald w-100 py-2 fw-semibold shadow-sm mb-3">
        Update Password & Continue
      </button>

      <div class="text-center small">
        <a href="{% url 'accounts:login' %}" class="text-muted text-decoration-none">Cancel & Return to Login</a>
      </div>
    </form>
  </div>
</body>
</html>
