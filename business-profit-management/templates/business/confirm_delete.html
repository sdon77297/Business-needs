{% extends 'base.html' %}
{% block title %}{{ title }} - Profit & Loss Management System{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 shadow-sm rounded-4 p-4 text-center my-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 text-danger rounded-circle p-3 mx-auto mb-3" style="width: 64px; height: 64px;">
        <i class="fa-solid fa-triangle-exclamation fa-2x"></i>
      </div>

      <h5 class="fw-bold text-dark mb-2">{{ title }}</h5>
      <p class="text-muted small mb-4 leading-relaxed">{{ message }}</p>

      <form method="POST">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-2">
          <a href="{% url cancel_url %}" class="btn btn-light border px-4">Cancel</a>
          <button type="submit" class="btn btn-danger px-4">
            <i class="fa-solid fa-trash me-1"></i> Yes, Permanently Delete
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
