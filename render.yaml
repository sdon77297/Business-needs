services:
  # Backend API Service (Node.js + Express + Mongoose)
  - type: web
    name: mfef-wealth-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_NAME
        value: mfef_session_token
      - key: CLIENT_URL
        fromService:
          type: web
          name: mfef-wealth-portal
          property: host

  # Frontend Portal (React 18 + Vite + Tailwind CSS)
  - type: web
    name: mfef-wealth-portal
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: mfef-wealth-api
          property: host
